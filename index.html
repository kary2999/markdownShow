<!DOCTYPE html>
<html lang="zh-CN" data-mdviewer-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Show · 拖拽即渲染</title>
    <meta
      name="description"
      content="在浏览器里直接把 Markdown 拖进来即渲染：代码高亮、目录、亮/暗主题、Mermaid。可装到桌面像 App 一样打开。"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0969da" />
    <link rel="icon" href="icons/icon128.png" />
    <link rel="apple-touch-icon" href="icons/icon128.png" />

    <link id="mdv-hljs-light" rel="stylesheet" href="lib/hljs-light.css" />
    <link id="mdv-hljs-dark" rel="stylesheet" href="lib/hljs-dark.css" disabled />
    <link rel="stylesheet" href="app.css?v=13" />
  </head>
  <body>
    <!-- 统一顶栏：品牌 + Tab + 操作 -->
    <header id="mdv-topbar">
      <div class="mdv-brand">
        <span class="mdv-brand-mark">M</span>
        <span class="mdv-brand-name">Markdown Show</span>
      </div>
      <div id="mdv-tabs" hidden></div>
      <div id="mdv-toolbar">
        <button id="mdv-open-btn" title="打开 .md 文件">
          <span class="mdv-btn-ico">📂</span><span class="mdv-btn-txt">打开</span>
        </button>
        <button id="mdv-filepanel-btn" title="管理本地文件夹">
          <span class="mdv-btn-ico">🗂</span><span class="mdv-btn-txt">文件夹</span>
        </button>
        <button id="mdv-refresh-btn" title="重新加载当前文档">
          <span class="mdv-btn-ico">🔄</span><span class="mdv-btn-txt">刷新</span>
        </button>
        <button id="mdv-present-btn" title="演示模式（全屏幻灯片）">
          <span class="mdv-btn-ico">▶</span><span class="mdv-btn-txt">演示</span>
        </button>
        <button id="mdv-find-btn" class="mdv-btn-icon-only" title="搜索正文 (Ctrl+F)">🔍</button>
        <button id="mdv-export-pdf-btn" title="导出 PDF（打印）">
          <span class="mdv-btn-ico">🖨</span><span class="mdv-btn-txt">PDF</span>
        </button>
        <button id="mdv-export-html-btn" title="导出独立 HTML">
          <span class="mdv-btn-ico">⬇</span><span class="mdv-btn-txt">HTML</span>
        </button>
        <span class="mdv-toolbar-sep"></span>
        <button id="mdv-style-btn" title="切换风格皮肤">
          <span class="mdv-btn-ico">🎨</span><span class="mdv-btn-txt">刊物</span>
        </button>
        <button id="mdv-theme-btn" class="mdv-btn-icon-only" title="切换主题">🌓</button>
      </div>
    </header>

    <!-- 落地页 / 空状态 -->
    <div id="mdv-landing">
      <div class="mdv-landing-card">
        <div class="mdv-logo">📄</div>
        <h1>Markdown Show</h1>
        <p>把 <code>.md</code> 文件拖到这里，即刻渲染。</p>
        <button id="mdv-landing-open">选择文件</button>
        <ul class="mdv-features">
          <li>✨ 代码高亮</li>
          <li>🧭 目录 TOC</li>
          <li>🌓 亮/暗主题</li>
          <li>📊 Mermaid 图表</li>
        </ul>
      </div>
    </div>

    <!-- 渲染区域 -->
    <div id="mdv-layout" hidden>
      <nav id="mdv-toc" aria-label="目录"></nav>
      <main id="mdv-content" class="markdown-body"></main>
    </div>

    <!-- 拖拽遮罩 -->
    <div id="mdv-drop-overlay">松开以渲染 Markdown 文件</div>

    <input
      id="mdv-file-input"
      type="file"
      accept=".md,.markdown,.mdown,.mkd,.mdx,.txt,text/plain,text/markdown"
      multiple
      hidden
    />

    <script src="lib/marked.min.js"></script>
    <script src="lib/purify.min.js"></script>
    <script src="lib/highlight.min.js"></script>
    <script src="lib/mermaid.min.js"></script>
    <script src="lib/filetree-core.js"></script>
    <script src="app.js?v=12"></script>
    <script src="filemanager.js?v=1"></script>
  </body>
</html>
